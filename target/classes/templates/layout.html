<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Alariis">Alariis Bookstore</title>

    <!-- SaaS 2025 Styles -->
    <link rel="stylesheet" th:href="@{/css/saas-dashboard.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <th:block layout:fragment="extra-css"></th:block>
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-sparkles mr-2"></i> Alariis
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <p class="nav-label">Main</p>
                    <a th:href="@{/}" class="nav-item"
                        th:classappend="${currentUri == '/' ? 'active' : ''}">
                        <i class="fas fa-chart-pie"></i> Dashboard
                    </a>
                    <a th:href="@{/books}" class="nav-item"
                        th:classappend="${currentUri.startsWith('/books') ? 'active' : ''}">
                        <i class="fas fa-book-open"></i> Books
                    </a>
                </div>

                <div class="nav-section">
                    <p class="nav-label">Customer</p>
                    <a th:href="@{/cart}" class="nav-item"
                        th:classappend="${currentUri.startsWith('/cart') ? 'active' : ''}">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span th:if="${session.cartItemCount > 0}" th:text="${session.cartItemCount}"
                            style="margin-left: auto; background: var(--accent-indigo); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem;">0</span>
                    </a>
                    <a th:href="@{/my-orders}" class="nav-item"
                        th:classappend="${currentUri.startsWith('/my-orders') ? 'active' : ''}"
                        sec:authorize="isAuthenticated()">
                        <i class="fas fa-box"></i> My Orders
                    </a>
                    <a th:href="@{/profile}" class="nav-item"
                        th:classappend="${currentUri.startsWith('/profile') ? 'active' : ''}"
                        sec:authorize="isAuthenticated()">
                        <i class="fas fa-user-circle"></i> My Profile
                    </a>
                </div>

                <div class="nav-section" sec:authorize="hasRole('ADMIN')">
                    <p class="nav-label">Admin Control</p>
                    <a th:href="@{/admin/dashboard}" class="nav-item" style="color: var(--danger);">
                        <i class="fas fa-lock"></i> Admin Panel
                    </a>
                </div>

                <div class="nav-section" sec:authorize="isAnonymous()">
                    <p class="nav-label">Account</p>
                    <a th:href="@{/login}" class="nav-item">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                    <a th:href="@{/register}" class="nav-item">
                        <i class="fas fa-user-plus"></i> Register
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Body -->
        <div class="main-body">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="search-input" placeholder="Search books, authors, ISBN...">
                </div>

                <div class="topbar-actions">
                    <div class="action-icon">
                        <i class="far fa-bell"></i>
                        <span class="badge"></span>
                    </div>

                    <div class="user-profile" sec:authorize="isAuthenticated()">
                        <div class="avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U
                        </div>
                        <div class="user-info">
                            <span class="name" sec:authentication="name">User Name</span>
                            <span class="role">Customer</span>
                        </div>
                        <i class="fas fa-chevron-down" style="font-size: 0.75rem; color: var(--text-secondary);"></i>
                    </div>

                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn-primary">Sign In</a>
                    </div>

                    <form th:action="@{/logout}" method="post" id="logoutForm" sec:authorize="isAuthenticated()"
                        style="display:none;"></form>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-container" layout:fragment="content">
                <!-- Page Content Injected Here -->
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <th:block layout:fragment="extra-js"></th:block>
</body>

</html>
