<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Alariis Bookstore'">Alariis Bookstore</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M12 2l-5.5 9h11z'/><path d='M22 22H2v-2h20v2zM12 4L6 13h12L12 4z'/><path d='M4 22h16c0-4-3-8-8-8s-8 4-8 8z'/></svg>">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global Design System CSS -->
    <link rel="stylesheet" th:href="@{/css/global-design-system.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/premium-home.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <!-- Scroll Progress Indicator -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Enhanced Navigation -->
    <div th:replace="~{fragments/header :: nav}"></div>

    <!-- Main Content (will be replaced by each page) -->
    <main>
        <!-- Page content goes here -->
    </main>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Toast Container (for notifications) -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Global JavaScript -->
    <script th:src="@{/js/design-system.js}"></script>
    <script th:src="@{/js/premium-home.js}"></script>
</body>

</html>
