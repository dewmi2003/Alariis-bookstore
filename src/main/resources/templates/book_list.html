<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Browse Books - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            /* Books Page Specific Styles using Design System Variables */
            .books-hero {
                background: var(--gradient-hero);
                padding: var(--space-6) 0 var(--space-4);
                text-align: center;
                color: white;
            }

            .books-hero h1 {
                font-size: var(--text-5xl);
                margin-bottom: var(--space-2);
                color: white;
            }

            .books-hero p {
                font-size: var(--text-lg);
                opacity: 0.9;
                color: white;
            }

            .filters-sidebar {
                background: var(--bg-white);
                padding: var(--space-3);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
                position: sticky;
                top: 100px;
            }

            .filter-section {
                margin-bottom: var(--space-3);
            }

            .filter-title {
                font-family: var(--font-heading);
                font-weight: 700;
                margin-bottom: var(--space-2);
                color: var(--primary-indigo);
                font-size: var(--text-sm);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .books-grid-layout {
                display: grid;
                grid-template-columns: 280px 1fr;
                gap: var(--space-4);
                margin-top: var(--space-4);
            }

            @media (max-width: 1024px) {
                .books-grid-layout {
                    grid-template-columns: 1fr;
                }

                .filters-sidebar {
                    position: static;
                }
            }

            /* Filter Chips Overrides */
            .filter-chip {
                padding: 0.5rem 1rem;
                background: var(--bg-light-gray);
                border-radius: var(--radius-full);
                font-size: var(--text-xs);
                font-weight: 600;
                cursor: pointer;
                transition: var(--transition-fast);
                border: 2px solid transparent;
            }

            .filter-chip:hover,
            .filter-chip.active {
                background: var(--primary-indigo);
                color: white;
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <!-- Hero Section -->
        <section class="books-hero">
            <div class="container">
                <h1>Browse Collection</h1>
                <p>Discover your next favorite story in our curated library</p>
            </div>
        </section>

        <!-- Main Content -->
        <section style="padding: var(--space-4) 0; background: var(--bg-soft-white);">
            <div class="container">
                <div class="books-grid-layout">
                    <!-- Sidebar Filters -->
                    <aside>
                        <div class="filters-sidebar scroll-animate">
                            <div class="filter-section">
                                <h3 class="filter-title"><i class="fas fa-tags"></i> Categories</h3>
                                <div class="flex flex-wrap gap-1" style="display: flex; flex-wrap: wrap;">
                                    <button class="filter-chip active" data-category="all">All</button>
                                    <button th:each="cat : ${categories}" class="filter-chip"
                                        th:data-category="${#strings.toLowerCase(cat.name)}"
                                        th:text="${cat.name}">Category</button>
                                </div>
                            </div>

                            <div class="filter-section">
                                <h3 class="filter-title"><i class="fas fa-dollar-sign"></i> Price Range</h3>
                                <input type="range" class="form-control" id="priceRange" min="0" max="100" value="100"
                                    style="padding: 0.5rem;">
                                <div class="flex justify-between mt-1 text-sm font-bold text-indigo">
                                    <span>$0</span>
                                    <span id="maxPriceDisplay">$100</span>
                                </div>
                            </div>

                            <button class="btn btn-primary w-full mt-2" onclick="clearFilters()" style="width: 100%;">
                                <i class="fas fa-sync-alt"></i> Clear All
                            </button>
                        </div>
                    </aside>

                    <!-- Books Display -->
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <div class="text-secondary">
                                Showing <strong th:text="${#lists.size(books)}">0</strong> products
                            </div>
                            <div class="flex items-center gap-1">
                                <span class="text-sm font-bold">Sort:</span>
                                <select id="sortBy" class="form-control" style="width: auto; padding: 0.4rem;">
                                    <option value="newest">Newest</option>
                                    <option value="price-low">Price: Low-High</option>
                                    <option value="price-high">Price: High-Low</option>
                                    <option value="title">Title: A-Z</option>
                                </select>
                            </div>
                        </div>

                        <!-- Grid -->
                        <div class="grid grid-cols-3"
                            style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-3);">
                            <div class="card p-0 overflow-hidden" th:each="book : ${books}"
                                style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
                                <div style="position: relative; aspect-ratio: 2/3; overflow: hidden;">
                                    <img th:if="${book.coverImage != null}"
                                        th:src="@{'/images/books/' + ${book.coverImage}}"
                                        class="w-full h-full object-cover"
                                        style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;"
                                        onmouseover="this.style.transform='scale(1.1)'"
                                        onmouseout="this.style.transform='scale(1)'">
                                    <div th:if="${book.coverImage == null}"
                                        class="flex items-center justify-center bg-gray h-full">
                                        <i class="fas fa-book fa-3x text-light"></i>
                                    </div>
                                    <span th:if="${book.featured}" class="badge badge-error"
                                        style="position: absolute; top: 1rem; right: 1rem;">Featured</span>
                                </div>

                                <div class="p-3"
                                    style="padding: var(--space-2); flex-grow: 1; display: flex; flex-direction: column;">
                                    <div class="text-xs text-secondary underline"
                                        th:text="${book.category != null ? book.category.name : 'Uncategorized'}">
                                        Category</div>
                                    <h3 class="mt-1" th:text="${book.title}"
                                        style="font-size: 1.1rem; line-height: 1.3;">Book Title</h3>
                                    <p class="text-tertiary text-sm" th:text="${book.author}">Author</p>

                                    <div class="mt-auto pt-3 flex justify-between items-center">
                                        <span class="text-xl font-black text-indigo"
                                            th:text="'$' + ${book.price}">$0.00</span>
                                        <div class="flex gap-1">
                                            <a th:href="@{'/book/' + ${book.id}}" class="btn btn-primary"
                                                style="padding: 0.5rem; border-radius: var(--radius-sm);">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <form th:action="@{/cart/add}" method="post" style="margin: 0;">
                                                <input type="hidden" name="bookId" th:value="${book.id}">
                                                <input type="hidden" name="quantity" value="1">
                                                <button type="submit" class="btn btn-accent"
                                                    style="padding: 0.5rem; border-radius: var(--radius-sm);">
                                                    <i class="fas fa-shopping-cart"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div th:if="${#lists.isEmpty(books)}" class="text-center py-6">
                            <i class="fas fa-search fa-4x text-light mb-2"></i>
                            <h3>No books found</h3>
                            <p class="text-tertiary">Try adjusting your filters.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <th:block layout:fragment="extra-js">
        <script>
            // Simple visual filter logic for demonstration (Real app would use API)
            const priceRange = document.getElementById('priceRange');
            const maxPriceDisplay = document.getElementById('maxPriceDisplay');

            priceRange.addEventListener('input', (e) => {
                maxPriceDisplay.textContent = '$' + e.target.value;
            });

            function clearFilters() {
                priceRange.value = 100;
                maxPriceDisplay.textContent = '$100';
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                document.querySelector('[data-category="all"]').classList.add('active');
            }

            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', function () {
                    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        </script>
    </th:block>
</body>

</html>
