<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Forgot Password - Alariis Bookstore</title>
</head>

<body>
    <main layout:fragment="content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-card scroll-animate">
                    <div class="auth-header">
                        <h1 class="auth-title">Forgot Password</h1>
                        <p class="auth-subtitle">Enter your email to reset your password</p>
                    </div>

                    <div th:if="${message}" class="alert alert-success mb-6" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-error mb-6" th:text="${error}"></div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="form-group mb-4">
                            <label for="email" class="auth-label">Email Address</label>
                            <input type="email" id="email" name="email" class="auth-input" required
                                placeholder="name@example.com">
                        </div>

                        <button type="submit" class="auth-btn">
                            Send Reset Link
                        </button>

                        <div class="auth-footer">
                            <p>
                                <a th:href="@{/login}" class="font-semibold text-indigo hover:underline">Back to
                                    Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
