<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>My Orders - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .orders-container {
                max-width: 900px;
                margin: var(--space-8) auto;
            }

            .order-card {
                background: var(--bg-white);
                border-radius: var(--radius-xl);
                padding: var(--space-6);
                margin-bottom: var(--space-4);
                box-shadow: var(--shadow-sm);
                border: 1px solid var(--bg-light-gray);
                transition: var(--transition-base);
            }

            .order-card:hover {
                box-shadow: var(--shadow-md);
            }

            .order-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: var(--space-4);
                padding-bottom: var(--space-4);
                border-bottom: 2px dashed var(--bg-light-gray);
            }

            .order-item-row {
                display: flex;
                justify-content: space-between;
                padding: var(--space-2) 0;
            }

            .status-badge {
                padding: var(--space-1) var(--space-3);
                border-radius: var(--radius-full);
                font-size: var(--text-xs);
                font-weight: var(--font-black);
                text-transform: uppercase;
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container mt-4 mb-10">
            <div class="orders-container">
                <h1 class="mb-6 flex items-center gap-3">
                    <i class="fas fa-box text-indigo"></i> My Order History
                </h1>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(orders)}" class="card text-center py-10 scroll-animate">
                    <i class="fas fa-history fa-5x text-light mb-4"></i>
                    <h2 class="text-secondary">No orders found</h2>
                    <p class="text-tertiary mb-6">You haven't placed any orders yet. Start your reading journey today!
                    </p>
                    <a th:href="@{/books}" class="btn btn-primary btn-lg">Browse Our Library</a>
                </div>

                <!-- Orders List -->
                <div th:unless="${#lists.isEmpty(orders)}">
                    <div class="order-card scroll-animate" th:each="order : ${orders}">
                        <div class="order-header">
                            <div>
                                <span class="text-xs text-tertiary uppercase font-bold">Order ID</span>
                                <h3 class="text-xl" th:text="'#' + ${order.id}">#00000</h3>
                                <p class="text-xs text-secondary"
                                    th:text="${#temporals.format(order.orderDate, 'MMMM dd, yyyy HH:mm')}">Date</p>
                            </div>
                            <div class="text-right">
                                <span th:text="${order.status}"
                                    th:class="'status-badge ' + (${order.status == 'PENDING' ? 'bg-warning-light text-warning' : (order.status == 'COMPLETED' ? 'bg-success-light text-success' : 'bg-error-light text-error')})">
                                    STATUS
                                </span>
                                <div class="text-2xl font-black text-indigo mt-2"
                                    th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</div>
                            </div>
                        </div>

                        <div class="order-items mt-4 mb-6">
                            <div class="order-item-row border-bottom" th:each="item : ${order.items}">
                                <div class="flex flex-col">
                                    <span class="font-bold" th:text="${item.book.title}">Book Title</span>
                                    <span class="text-xs text-tertiary" th:text="${item.book.author}">Author</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm text-secondary" th:text="'Qty: ' + ${item.quantity}">Qty:
                                        1</span>
                                    <div class="font-bold text-indigo"
                                        th:text="'$' + ${#numbers.formatDecimal(item.price * item.quantity, 1, 2)}">
                                        $0.00</div>
                                </div>
                            </div>
                        </div>

                        <div class="order-actions flex gap-3">
                            <a th:href="@{'/order/confirmation/' + ${order.id}}" class="btn btn-sm btn-outline">
                                <i class="fas fa-info-circle"></i> View Details
                            </a>
                            <a th:href="@{'/order/confirmation/' + ${order.id} + '/pdf'}"
                                class="btn btn-sm btn-ghost text-indigo">
                                <i class="fas fa-file-pdf"></i> Invoice
                            </a>
                            <form th:if="${order.status == 'PENDING'}"
                                th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post" class="ml-auto">
                                <button type="submit" class="btn btn-sm btn-ghost text-error"
                                    onclick="return confirm('Cancel this order?')">
                                    <i class="fas fa-times-circle"></i> Cancel
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
