<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Shopping Cart - Alariis Bookstore</title>
</head>

<body>
    <th:block layout:fragment="extra-css">
        <style>
            .cart-grid {
                display: grid;
                grid-template-columns: 1fr 350px;
                gap: var(--space-6);
                align-items: start;
            }

            .cart-item-card {
                background: var(--bg-white);
                border-radius: var(--radius-xl);
                padding: var(--space-3);
                margin-bottom: var(--space-3);
                display: flex;
                gap: var(--space-4);
                box-shadow: var(--shadow-sm);
                transition: var(--transition-base);
                border: 1px solid var(--bg-light-gray);
            }

            .cart-item-card:hover {
                box-shadow: var(--shadow-md);
                transform: translateY(-2px);
            }

            .cart-img {
                width: 100px;
                height: 140px;
                object-fit: cover;
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-sm);
            }

            .summary-box {
                background: var(--bg-white);
                border-radius: var(--radius-xl);
                padding: var(--space-4);
                box-shadow: var(--shadow-lg);
                border: 1px solid var(--bg-light-gray);
                position: sticky;
                top: 100px;
            }

            @media (max-width: 992px) {
                .cart-grid {
                    grid-template-columns: 1fr;
                }

                .summary-box {
                    position: static;
                }
            }
        </style>
    </th:block>

    <main layout:fragment="content">
        <div class="container mt-4">
            <h1 class="mb-4"><i class="fas fa-shopping-basket text-indigo"></i> Your Shopping Basket</h1>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(cartItems)}" class="card text-center py-10 scroll-animate">
                <i class="fas fa-shopping-cart fa-5x text-light mb-4"></i>
                <h2 class="text-secondary">Your basket is quite light!</h2>
                <p class="text-tertiary mb-6">Explore our library and fill it with amazing stories.</p>
                <a th:href="@{/books}" class="btn btn-primary btn-lg">Browse Books</a>
            </div>

            <div th:unless="${#lists.isEmpty(cartItems)}" class="cart-grid">
                <!-- Items List -->
                <div class="cart-items-list">
                    <div class="cart-item-card scroll-animate" th:each="item : ${cartItems}">
                        <img th:if="${item.book.coverImage != null}"
                            th:src="@{'/images/books/' + ${item.book.coverImage}}" class="cart-img">
                        <div th:if="${item.book.coverImage == null}"
                            class="cart-img flex items-center justify-center bg-gray">
                            <i class="fas fa-book fa-2x text-light"></i>
                        </div>

                        <div class="flex-grow flex flex-col justify-between">
                            <div>
                                <h3 th:text="${item.book.title}" class="text-xl">Book Title</h3>
                                <p th:text="${item.book.author}" class="text-secondary text-sm">Author</p>
                            </div>

                            <div class="flex justify-between items-end mt-4">
                                <div class="flex items-center gap-2">
                                    <form th:action="@{/cart/update}" method="post"
                                        class="flex items-center gap-1 bg-light-gray p-1 rounded-md">
                                        <input type="hidden" name="bookId" th:value="${item.book.id}">
                                        <button type="submit" class="btn btn-sm btn-ghost p-1" name="quantity"
                                            th:value="${item.quantity - 1}" th:disabled="${item.quantity <= 1}">
                                            <i class="fas fa-minus text-xs"></i>
                                        </button>
                                        <input type="number" readonly th:value="${item.quantity}"
                                            class="font-bold text-center w-8 bg-transparent border-none">
                                        <button type="submit" class="btn btn-sm btn-ghost p-1" name="quantity"
                                            th:value="${item.quantity + 1}">
                                            <i class="fas fa-plus text-xs"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{'/cart/remove/' + ${item.book.id}}"
                                        class="text-error text-sm hover:underline ml-2"
                                        onclick="return confirm('Remove item?')">
                                        <i class="fas fa-trash"></i> Remove
                                    </a>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-tertiary" th:text="'$' + ${item.book.price} + ' each'">
                                        $0.00 each</div>
                                    <div class="text-xl font-bold text-indigo"
                                        th:text="'$' + ${#numbers.formatDecimal(item.totalPrice, 1, 2)}">$0.00</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Sidebar -->
                <aside class="summary-box scroll-animate">
                    <h3 class="mb-4 border-bottom pb-2">Order Summary</h3>

                    <div class="flex justify-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <strong th:text="'$' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">$0.00</strong>
                    </div>

                    <div class="flex justify-between mb-2">
                        <span class="text-secondary">Shipping</span>
                        <span class="text-success font-bold">FREE</span>
                    </div>

                    <div class="flex justify-between mb-4 border-bottom pb-4">
                        <span class="text-secondary">Est. Tax (10%)</span>
                        <strong th:text="'$' + ${#numbers.formatDecimal(totalAmount * 0.1, 1, 2)}">$0.00</strong>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <span class="text-lg font-bold">Total</span>
                        <span class="text-3xl font-black text-indigo"
                            th:text="'$' + ${#numbers.formatDecimal(totalAmount + (totalAmount * 0.1), 1, 2)}">$0.00</span>
                    </div>

                    <form th:action="@{/cart/clear}" method="post" class="mb-3">
                        <button type="submit" class="btn btn-outline-error w-full"
                            onclick="return confirm('Are you sure you want to remove all items from your basket?')">
                            <i class="fas fa-trash-alt"></i> Remove All Items
                        </button>
                    </form>

                    <a th:href="@{/checkout}" class="btn btn-accent btn-lg w-full mb-3" style="width: 100%;">
                        <i class="fas fa-shield-alt"></i> Checkout Securely
                    </a>
                    <a th:href="@{/books}" class="btn btn-ghost w-full" style="width: 100%;">
                        <i class="fas fa-arrow-left"></i> Keep Shopping
                    </a>

                    <div class="mt-6 pt-4 border-top text-center">
                        <div class="flex justify-around text-tertiary">
                            <i class="fab fa-cc-visa fa-2x"></i>
                            <i class="fab fa-cc-mastercard fa-2x"></i>
                            <i class="fab fa-cc-paypal fa-2x"></i>
                            <i class="fab fa-cc-apple-pay fa-2x"></i>
                        </div>
                        <p class="text-xs text-tertiary mt-4">SSL Encryption Enabled</p>
                    </div>
                </aside>
            </div>
        </div>
    </main>
</body>

</html>
