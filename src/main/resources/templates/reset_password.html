<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Reset Password - Alariis Bookstore</title>
</head>

<body>
    <main layout:fragment="content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-card scroll-animate">
                    <div class="auth-header">
                        <h1 class="auth-title">Reset Password</h1>
                        <p class="auth-subtitle">Enter your new password below</p>
                    </div>

                    <div th:if="${error}" class="alert alert-error mb-6" th:text="${error}"></div>

                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="form-group mb-4">
                            <label for="password" class="auth-label">New Password</label>
                            <input type="password" id="password" name="password" class="auth-input" required
                                placeholder="Enter new password">
                        </div>

                        <button type="submit" class="auth-btn">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
