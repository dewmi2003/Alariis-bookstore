<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Checkout - Alaris Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .form-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .form-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--secondary-accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .total-row {
            font-weight: 700;
            font-size: 1.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #ddd;
            color: var(--accent-color);
        }

        .payment-icons {
            font-size: 2rem;
            color: #666;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: nav}"></div>

    <div class="container">
        <h1 class="section-title">Secure Checkout</h1>

        <form th:action="@{/checkout/process}" method="post" class="checkout-container">

            <div class="checkout-main">
                <!-- Shipping Details -->
                <div class="form-section">
                    <h2><i class="fas fa-map-marker-alt"></i> Shipping Address</h2>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullName" class="form-control" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Address Line 1</label>
                        <input type="text" name="address" class="form-control" required placeholder="123 Book St.">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" name="city" class="form-control" required placeholder="New York">
                        </div>
                        <div class="form-group">
                            <label>Zip Code</label>
                            <input type="text" name="zip" class="form-control" required placeholder="10001">
                        </div>
                    </div>
                </div>

                <!-- Payment Details -->
                <div class="form-section">
                    <h2><i class="fas fa-credit-card"></i> Payment Method</h2>

                    <div class="payment-icons">
                        <i class="fab fa-cc-visa" style="color: #1a1f71;"></i>
                        <i class="fab fa-cc-mastercard" style="color: #eb001b;"></i>
                        <i class="fab fa-cc-amex" style="color: #006fcf;"></i>
                    </div>

                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" name="cardNumber" class="form-control" required
                            placeholder="0000 0000 0000 0000" maxlength="19">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" name="expiry" class="form-control" required placeholder="MM/YY"
                                maxlength="5">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" name="cvv" class="form-control" required placeholder="123" maxlength="3">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Confirmation Side (Simulated totals, backend calculates real logic) -->
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Items Total</span>
                    <span>Calculated at next step</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span style="color: green;">Free</span>
                </div>

                <p style="font-size: 0.9rem; color: #777; margin: 1rem 0;">
                    By clicking "Place Order", you agree to our terms. This is a simulation, no real money will be
                    charged.
                </p>

                <button type="submit" class="btn"
                    style="width: 100%; padding: 1rem; font-size: 1.2rem; background-color: var(--accent-color);">
                    Place Order
                </button>
            </div>

        </form>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
