<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Orders - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: nav}"></div>
    <div class="container">
        <h1>Manage Orders</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${order.user.email}">user@example.com</td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                    <td th:text="'$' + ${order.totalAmount}">$100.00</td>
                    <td th:text="${order.status}">PENDING</td>
                    <td>
                        <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post"
                            style="display:inline;">
                            <select name="status" onchange="this.form.submit()" style="padding: 0.3rem;">
                                <option value="PENDING" th:selected="${order.status == 'PENDING'}">PENDING</option>
                                <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">SHIPPED</option>
                                <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED
                                </option>
                                <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED
                                </option>
                            </select>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
